<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootcamp Collab — Informatics Summit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }

        .badge-custom {
            background: #0f172a;
            color: #7dd3fc;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: .5px;
        }

        .card {
            border: 2px dashed #cbd5e1;
            min-height: 180px;
            transition: border-color .2s, box-shadow .2s;
        }

        .card:hover {
            border-color: #94a3b8;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .06);
        }

        .card-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        .card-empty-icon {
            font-size: 32px;
            opacity: .35;
        }

        .card-empty-hint {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        /* Warna aksen avatar & role per card */
        #card-1 .card-avatar {
            background: #dbeafe;
            color: #1d4ed8;
        }

        #card-1 .card-role {
            background: #dbeafe;
            color: #1d4ed8;
        }

        #card-2 .card-avatar {
            background: #dcfce7;
            color: #15803d;
        }

        #card-2 .card-role {
            background: #dcfce7;
            color: #15803d;
        }

        #card-3 .card-avatar {
            background: #fef3c7;
            color: #b45309;
        }

        #card-3 .card-role {
            background: #fef3c7;
            color: #b45309;
        }

        #card-4 .card-avatar {
            background: #fce7f3;
            color: #be185d;
        }

        #card-4 .card-role {
            background: #fce7f3;
            color: #be185d;
        }

        #card-5 .card-avatar {
            background: #f3e8ff;
            color: #7e22ce;
        }

        #card-5 .card-role {
            background: #f3e8ff;
            color: #7e22ce;
        }

        #card-6 .card-avatar {
            background: #ffedd5;
            color: #c2410c;
        }

        #card-6 .card-role {
            background: #ffedd5;
            color: #c2410c;
        }

        .card-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
        }

        .card-role {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .footer-note {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
